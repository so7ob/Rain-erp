name: Verified integration

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: rain-erp-delivery
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'main') &&
      !startsWith(github.event.workflow_run.display_title, 'CI: PR #') &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      # Privileged code always comes from protected main, never a PR checkout/artifact.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reconcile verified deliveries and releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node tools/workflow/automation.mjs reconcile --run-id "$VERIFIED_RUN_ID"
