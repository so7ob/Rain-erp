name: CI
run-name: >-
  ${{ (github.event_name == 'pull_request' || inputs.pr_number != '') && format('CI: PR #{0}', github.event.pull_request.number || inputs.pr_number) || format('CI: branch {0}', github.ref_name) }}

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for an automation-created branch; empty verifies the branch itself
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate version and workflow tooling
        run: |
          node tools/workflow/version.mjs
          node --test tools/workflow/*.test.mjs
          git diff --check
      - name: Install frontend dependencies from the lockfile
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Test frontend configuration
        working-directory: frontend
        run: corepack pnpm test
      - name: Validate translation catalogs and localization inventory
        working-directory: frontend
        run: corepack pnpm i18n:check
      - name: Build frontend production assets
        working-directory: frontend
        run: corepack pnpm build
      - name: Type-check all frontend source
        working-directory: frontend
        run: corepack pnpm ts:check
      - name: Validate frontend assets and Maven product version
        working-directory: frontend
        run: corepack pnpm check:build
      - name: Install Chromium for localization acceptance
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Verify authentication localization and accessibility in Chromium
        working-directory: frontend
        run: corepack pnpm test:browser
      - name: Resolve JDK version
        id: jdk
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = ET.parse('pom.xml').getroot().findtext('m:properties/m:java.version', namespaces=ns)
          if not version or not version.isdigit():
              raise SystemExit('Missing or invalid java.version')
          print(f'version={version}')
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ steps.jdk.outputs.version }}
          distribution: temurin
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build and test active modules
        run: mvn -B -ntp -pl yudao-server -am verify -s .github/maven-settings.xml
      - name: Validate reported tests and disabled-test baseline
        if: always()
        run: python3 tools/workflow/test_report.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: warn
          retention-days: 14
      - name: Upload localization browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: localization-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/browser-results/
            .runtime/browser-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
